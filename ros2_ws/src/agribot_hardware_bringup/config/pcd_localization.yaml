pcd_global_localizer:
  ros__parameters:
    cloud_topic: /cloud_registered_body
    cloud_frame: body
    odom_topic: /fastlio/odometry
    pose_topic: /localization_pose
    ready_topic: /localization/ready
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # In repetitive corridors, require an approximate RViz 2D Pose Estimate.
    # NDT refines this 2D prior into a full 3D pose before navigation is enabled.
    initial_pose_topic: /initialpose
    require_initial_pose: true
    initial_pose_max_translation_error: 2.0
    initial_pose_max_yaw_error: 0.7853981633974483

    # FAST-LIO body is the IMU frame; base_link is the rear-axle center.
    base_to_body_xyz: [0.1425, 0.0, 0.143]
    base_to_body_rpy: [0.0, 0.0, 0.0]

    # Keep a dense map/scan for final GICP and a coarser map for robust NDT capture.
    map_voxel_size: 0.15
    coarse_map_voxel_size: 0.30
    scan_voxel_size: 0.10
    feature_voxel_size: 0.35
    normal_radius: 0.70
    feature_radius: 1.10
    min_range: 0.50
    max_range: 30.0
    min_z: -0.50
    max_z: 2.50
    min_scan_points: 250
    initial_scan_count: 10
    max_odom_age: 0.10

    # Match only the neighborhood around the RViz prior or predicted FAST-LIO pose.
    # The scan radius stays inside the target radius so edge points have support.
    local_submap_radius: 15.0
    local_scan_radius: 12.0
    local_submap_min_points: 300

    # Full-map fallback used only when require_initial_pose is disabled.
    global_max_iterations: 40000
    global_correspondence_randomness: 5
    global_similarity_threshold: 0.85
    global_max_correspondence_distance: 0.90
    global_inlier_fraction: 0.12
    global_retry_period: 5.0

    # Coarse NDT captures the basin, fine NDT tightens it, then GICP aligns surfaces.
    coarse_ndt_resolution: 0.80
    coarse_ndt_step_size: 0.10
    coarse_ndt_transformation_epsilon: 0.01
    coarse_ndt_max_iterations: 35
    fine_ndt_resolution: 0.40
    fine_ndt_step_size: 0.05
    fine_ndt_transformation_epsilon: 0.002
    fine_ndt_max_iterations: 50
    gicp_max_correspondence_distance: 0.30
    gicp_transformation_epsilon: 0.0001
    gicp_rotation_epsilon: 0.0001
    gicp_fitness_epsilon: 0.0001
    gicp_max_iterations: 30
    gicp_correspondence_randomness: 20

    # Reject plausible-looking but displaced matches in the repetitive corridor.
    fitness_max_range: 0.50
    max_fitness_score: 0.12
    overlap_distance: 0.30
    minimum_overlap: 0.50
    maximum_tilt: 0.35
    maximum_base_height: 0.50

    # Low-rate map correction fused with high-rate FAST-LIO odometry.
    matching_rate_hz: 0.50
    required_consecutive_matches: 2
    runtime_failure_limit: 3
    relocalize_failure_limit: 5
    maximum_translation_correction: 0.50
    maximum_rotation_correction: 0.25
    correction_alpha: 0.35
