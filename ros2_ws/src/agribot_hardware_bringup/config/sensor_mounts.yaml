# Physical-vehicle sensor transforms measured from the rear-axle-centered base_link.
# Convention: parent frame base_link, translation in meters, RPY in radians.
imu:
  child_frame: imu_link
  xyz: [0.1425, 0.0, 0.143]
  # New rigid mount, calibrated on 2026-08-05 from two independent level-floor
  # windows. Rotation maps imu_link into base_link.
  rpy: [0.000572424, -0.009139547, -0.000002616]
lidar:
  child_frame: lidar_link
  xyz: [0.48, 0.0, 0.233]
  # Rotation maps the C16 optical frame into rear-axle-centered base_link.
  rpy: [-0.007648487, -0.001835661, 0.000007020]
camera:
  child_frame: right_camera_optical_frame
  # Manually measured on 2026-08-24. The optical center is 95.5 mm forward of
  # the C16 center, centered laterally, and 11 mm above the IMU center.
  xyz: [0.5755, 0.0, 0.154]
  # Camera optical axes: +X right, +Y down, +Z forward.
  rpy: [-1.570796327, 0.0, -1.570796327]
rtk:
  child_frame: rtk_link
  # Left master antenna measurement point. The right secondary antenna is at
  # [0.1425, -0.2952585, 0.78476], giving a 0.590517 m lateral baseline.
  # Both antennas were raised by 0.500 m; x/y remain unchanged.
  xyz: [0.1425, 0.2952585, 0.78476]
  rpy: [0.0, 0.0, 0.0]
