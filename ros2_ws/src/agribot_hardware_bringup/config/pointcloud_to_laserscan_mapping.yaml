pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.2
    # Keep the mapping slice above the ground and below sparse canopy returns.
    min_height: 0.20
    max_height: 1.20
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259972
    scan_time: 0.1
    range_min: 0.30
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
