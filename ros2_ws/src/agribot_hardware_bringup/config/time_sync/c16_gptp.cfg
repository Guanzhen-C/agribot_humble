# Dedicated IEEE 802.1AS profile for the RDK X5 to C16 Ethernet link.
[global]
twoStepFlag                 1
gmCapable                   1
masterOnly                  1
priority1                   248
priority2                   248
clockClass                  248
clockAccuracy               0xFE
offsetScaledLogVariance     0xFFFF

domainNumber                0
logAnnounceInterval         0
logSyncInterval             -3
syncReceiptTimeout          3
assume_two_step             1
path_trace_enabled          1
follow_up_info              1

transportSpecific           0x1
ptp_dst_mac                 01:80:C2:00:00:0E
network_transport           L2
delay_mechanism             P2P
time_stamping               hardware

# This C16 firmware starts Pdelay only after receiving Sync. The Ethernet link
# is dedicated to one lidar, so the RDK can safely act as the designated master.
asCapable                   true
inhibit_delay_req           1

# C16 writes received PTP seconds directly into its packet timestamp and the
# ROS driver interprets those seconds as UTC. Keep the PHC in UTC and advertise
# zero offset; using phc2sys -w would put the cloud 37 seconds ahead in 2026.
utc_offset                  0

uds_address                 /run/agribot-c16-ptp4l.sock
logging_level               5
summary_interval            4
