# RMC/ZDA supplies the absolute UTC second exclusively over the dedicated TTL
# UART. Serial transport delay is not used for precision timekeeping; these
# samples only identify PPS seconds.
refclock SOCK /run/agribot-time/rtk.sock refid RTK poll 0 filter 4 noselect

# RTK GPIO PPS on RDK X5 physical pin 36 supplies the precise second edge.
refclock PPS /dev/pps-rtk lock RTK maxlockage 5 refid PPS poll 2 filter 8 prefer trust
