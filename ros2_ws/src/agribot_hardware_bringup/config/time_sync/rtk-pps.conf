# RMC/ZDA supplies the absolute UTC second over the dedicated TTL UART.
# It is used only to identify PPS seconds; its serial transport delay is not
# used for precision timekeeping.
refclock SOCK /run/chrony/rtk.sock refid RTK poll 0 filter 4 noselect

# RTK GPIO PPS on RDK X5 physical pin 36 supplies the precise second edge.
refclock PPS /dev/pps-rtk lock RTK maxlockage 5 refid PPS poll 2 filter 8 prefer trust
