/**:
  ros__parameters:
    # The vehicle is planar; the measurement remains the full C16 3D cloud.
    use_se3_pf: false
    rate_hz: 2.0
    gui_enable: false
    gui_camera_follow_robot: false

    base_link_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    topic_map: /mrpt_map/metric_map
    topic_initialpose: /initialpose
    topic_odometry: /fastlio/odometry
    topic_sensors_2d_scan: ""
    topic_sensors_point_clouds: /localization/lidar_points_base
    topic_gnss: /unused/gnss
    pub_topic_particles: /particlecloud
    pub_topic_pose: /pf_pose
    publish_tf: true
    transform_tolerance: 0.20
    no_update_tolerance: 1.0
    no_inputs_tolerance: 2.0

    # Keep every valid ICP candidate and let motion plus later scans disambiguate it.
    metric_map_use_only_these_layers: raw
    initial_particles_per_m2: 40
    relocalize_num_sigmas: 3.0
    relocalization_resolution_xy: 0.20
    relocalization_resolution_phi: 5.0
    relocalization_initial_divisions_xy: 10
    relocalization_initial_divisions_phi: 12
    relocalization_minimum_icp_quality: 0.55
    relocalization_icp_sigma: 1.5
    relocalization_min_sample_copies_per_candidate: 8

    motion_model_2d:
      modelSelection: mmGaussian
      gaussianModel:
        a1: 0.02
        a2: 0.001
        a3: 0.5
        a4: 0.20
        minStdXY: 0.01
        minStdPHI: 0.20
      thrunModel:
        alfa1_rot_rot: 0.05
        alfa2_rot_trans: 0.05
        alfa3_trans_trans: 0.05
        alfa4_trans_rot: 0.05
        additional_std_XY: 0.01
        additional_std_phi: 0.20

    # MRPT PF 2.5 on Humble loads this block over the active 2D model. Keep it
    # identical so the configured FAST-LIO odometry uncertainty is preserved.
    motion_model_no_odom_2d:
      modelSelection: mmGaussian
      gaussianModel:
        a1: 0.02
        a2: 0.001
        a3: 0.5
        a4: 0.20
        minStdXY: 0.01
        minStdPHI: 0.20
      thrunModel:
        alfa1_rot_rot: 0.05
        alfa2_rot_trans: 0.05
        alfa3_trans_trans: 0.05
        alfa4_trans_rot: 0.05
        additional_std_XY: 0.01
        additional_std_phi: 0.20

    motion_model_3d:
      modelSelection: mmGaussian
    motion_model_no_odom_3d:
      modelSelection: mmGaussian

    pf_options:
      adaptiveSampleSize: true
      BETA: 0.5
      PF_algorithm: pfStandardProposal
      # MRPT requires multinomial resampling when KLD changes the particle count.
      resamplingMethod: prMultinomial
      pfAuxFilterOptimal_MaximumSearchSamples: 100
      powFactor: 1.0
      max_loglikelihood_dyn_range: 15
      pfAuxFilterStandard_FirstStageWeightsMonteCarlo: false
      pfAuxFilterOptimal_MLE: false

    kld_options:
      KLD_minSampleSize: 300
      KLD_maxSampleSize: 10000
      KLD_binSize_XY: 0.20
      KLD_binSize_PHI: 0.0872664626
      KLD_delta: 0.05
      KLD_epsilon: 0.05
      KLD_minSamplesPerBin: 0

    override_likelihood_point_maps:
      sigma_dist: 0.12
      max_corr_distance: 0.80
      decimation: 10
