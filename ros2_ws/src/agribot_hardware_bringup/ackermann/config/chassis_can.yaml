/**:
  ros__parameters:
    # Physical Ackermann default: ZQWL-CANFD USB CDC bridge, channel 0 at 1 Mbit/s.
    # Set can_transport to socketcan and choose can_interface for a native CAN port.
    can_transport: zqwl_cdc
    can_interface: can0
    zqwl_port: /dev/serial/by-id/usb-ZQWL-CANFD_ZQWL-CANFD_966960660237-if00
    zqwl_channel: 0
    zqwl_bitrate: 1000000
    command_topic: /hardware/cmd_vel
    odom_topic: /wheel/odometry
    odom_frame: wheel_odom
    base_frame: base_link

    send_rate_hz: 20.0
    command_timeout_sec: 0.25
    feedback_timeout_sec: 0.6
    require_feedback_before_motion: true
    require_autonomous_mode: false
    require_localization_ready: false
    localization_ready_topic: /localization/ready
    localization_ready_timeout_sec: 2.5
    headlight: false

    wheelbase_m: 0.50
    max_steering_angle_rad: 0.384
    max_linear_velocity: 0.80
    max_angular_velocity: 0.65
    minimum_motion_speed: 0.02

    # WHEELTEC C50C classic CAN protocol, standard 11-bit IDs and 8-byte payloads.
    command_id: 0x181
    feedback_part1_id: 0x101
    feedback_part2_id: 0x102
    feedback_part3_id: 0x103
