map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      downsample_costmap: true
      downsampling_factor: 2
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.22
      minimum_turning_radius: 1.303241
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: false
      smooth_path: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.8
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      # Measured body outline plus 0.10 m fore/aft and 0.15 m lateral clearance.
      footprint: "[[0.754818, 0.485974], [0.754818, -0.485974], [-0.227500, -0.485974], [-0.227500, 0.485974]]"
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer, semantic_proximity_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.0
        inflation_radius: 2.0
      semantic_proximity_layer:
        plugin: agribot_hardware_bringup::SemanticProximityLayer
        enabled: true
        source_topic: /semantic_navigation/proximity_costmap
        maximum_cost: 240
        obstacle_costmap_topic: obstacle_costmap
        obstacle_costmap_publish_frequency: 1.0
      always_send_full_costmap: true
