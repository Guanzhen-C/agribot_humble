/**:
  ros__parameters:
    port: /dev/wheeltec_controller
    baud_rate: 115200
    command_topic: /hardware/cmd_vel
    odom_topic: /wheel/odometry
    odom_frame: wheel_odom
    base_frame: base_link
    chassis_imu_topic: /hardware/chassis_imu
    chassis_imu_frame: base_link
    battery_topic: /hardware/battery_voltage

    send_rate_hz: 20.0
    command_timeout_sec: 0.25
    feedback_timeout_sec: 0.6
    reconnect_interval_sec: 1.0
    require_feedback_before_motion: true

    wheelbase_m: 0.50
    max_steering_angle_rad: 0.384
    max_linear_velocity: 0.80
    max_angular_velocity: 0.65
    minimum_motion_speed: 0.02
    max_steering_rate_rad_s: 0.60
