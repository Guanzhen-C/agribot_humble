    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C2C079857-if00
    baud_rate: 115200
    command_topic: /hardware/cmd_vel
    odom_topic: /wheel/odometry
    odom_frame: wheel_odom
    base_frame: base_link
    chassis_imu_topic: /hardware/chassis_imu
    chassis_imu_frame: base_link
    battery_topic: /hardware/battery_voltage

    send_rate_hz: 20.0
