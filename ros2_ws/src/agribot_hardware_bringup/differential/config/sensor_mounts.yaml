# Measured on the tracked differential vehicle on 2026-08-26. base_link uses
# FLU at the ground projection of the nominal skid-steer center. Translation
# is in meters and RPY is in radians; RPY maps each child frame into base_link.
calibration:
  complete: false
  source: tracked_vehicle_manual_measurement_2026_08_26
  base_link_reference: tracked_contact_patch_center
imu:
  child_frame: imu_link
  xyz: [0.0, 0.0, 0.64]
  # The IMU housing axes are aligned with vehicle FLU.
  rpy: [0.0, 0.0, 0.0]
lidar:
  child_frame: lidar_link
  xyz: [0.47, 0.0, 0.91]
  # C16 native +X follows the cable outlet, which points vehicle rearward.
  rpy: [0.0, 0.0, 3.141592654]
camera:
  child_frame: right_camera_optical_frame
  xyz: [0.4735, 0.0, 0.96]
  # Camera optical axes: +X right, +Y down, +Z forward.
  rpy: [-1.570796327, 0.0, -1.570796327]
rtk:
  child_frame: rtk_link
  # Left master and right secondary antenna measurement points.
  xyz: [-0.48, 0.35, 0.748]
  secondary_xyz: [-0.48, -0.35, 0.748]
  baseline_m: 0.70
  rpy: [0.0, 0.0, 0.0]
