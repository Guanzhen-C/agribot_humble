pcd_map_builder:
  ros__parameters:
    cloud_topic: /cloud_registered
    cloud_frame: camera_init
    odom_topic: /fastlio/odometry
    map_frame: map
    odom_frame: odom
    map_base_path: /tmp/agribot_map

    # Count a voxel at most once per scan so transient returns are suppressed.
    voxel_size: 0.10
    min_observations: 2
    min_range: 0.50
    max_range: 30.0
    publish_period: 2.0

    # Suppress a person following behind the measured tracked-vehicle body.
    # Vehicle convention: +x forward, +y left, base_link at the skid-steer center.
    rear_exclusion_enabled: true
    rear_exclusion_min_x: -4.0
    rear_exclusion_max_x: -0.60
    rear_exclusion_half_width: 0.60

    # Height is measured from the ground-level base_link; the C16 center is at
    # z=0.91 m.
    occupancy_resolution: 0.05
    occupancy_min_z: 0.10
    occupancy_max_z: 1.80
    occupancy_padding: 1.0
    occupancy_dilation_radius: 0.05
    save_on_shutdown: false
