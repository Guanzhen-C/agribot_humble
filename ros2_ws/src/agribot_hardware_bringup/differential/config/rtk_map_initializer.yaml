rtk_map_initializer:
  ros__parameters:
    georeference_file: ""
    map_file: ""
    fix_topic: /rtk/fix
    quality_topic: /rtk/fix_quality
    heading_topic: /rtk/heading_with_covariance
    heading_solution_topic: /rtk/heading_solution
    odometry_topic: /fastlio/odometry
    initial_pose_topic: /initialpose
    localizer_status_topic: /localization/status
    localizer_ready_topic: /localization/ready
    status_topic: /localization/rtk_initializer_status
    seed_ready_topic: /localization/rtk_seed_ready
    seed_transform_topic: /localization/rtk_map_to_odom_seed
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    required_fix_quality: 4
    allowed_heading_solutions: [L1_INT, NARROW_INT]
    required_sample_count: 10
    minimum_inlier_count: 7
    heading_timeout_sec: 1.5
    maximum_position_deviation_m: 0.15
    maximum_heading_deviation_deg: 3.0
    maximum_heading_std_deg: 3.0
    default_horizontal_std_m: 0.03
    maximum_odometry_age_sec: 0.50
    maximum_georeference_horizontal_rmse_m: 0.20
    maximum_georeference_yaw_rmse_deg: 2.0
    # Position-only map calibration may supply a coarse yaw. The chassis stays
    # inhibited until the lidar NDT/GICP localizer accepts the refined pose.
    allow_unvalidated_georeference_yaw: true
    # Left master antenna lever arm; must match sensor_mounts.yaml rtk.xyz.
    base_to_master_antenna_m: [-0.48, 0.35, 0.748]
