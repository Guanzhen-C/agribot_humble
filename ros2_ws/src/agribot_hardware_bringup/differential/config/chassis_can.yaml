/**:
  ros__parameters:
    # Both transports use the shared, validated CAN backend. ZQWL is the
    # physical default; set socketcan explicitly for a native CAN interface.
    can_transport: zqwl_cdc
    can_interface: can0
    zqwl_port: /dev/serial/by-id/usb-ZQWL-CANFD_ZQWL-CANFD_966960660237-if00
    zqwl_channel: 0
    # 主控到分控数据格式 V2.4 的全局默认 CAN 波特率。
    zqwl_bitrate: 250000
    command_topic: /hardware/cmd_vel
    odom_topic: /wheel/odometry
    odom_frame: wheel_odom
    base_frame: base_link

    # The workbook specifies 200 ms and recommends 100-300 ms. The proven
    # legacy implementation used 100 ms, so this driver defaults to 10 Hz.
    send_rate_hz: 10.0
    command_timeout_sec: 0.25
    feedback_timeout_sec: 0.6
    recover_zqwl_startup: true
    startup_feedback_timeout_sec: 1.0
    require_feedback_before_motion: true
    require_autonomous_mode: true
    require_localization_ready: false
    localization_ready_topic: /localization/ready
    localization_ready_timeout_sec: 0.5
    headlight: false

    invert_left_motor: false
    invert_right_motor: false

    # Direct 0x514 command calibration. A value of 0.80 means that +100 percent
    # corresponds to an estimated +0.80 m/s wheel-group speed. No motor RPM or
    # reduction-ratio model is used to generate commands.
    track_width_m: 0.590224
    command_full_scale_wheel_speed_mps: 0.80
    # 0x533/0x534 的 Speed 字段未标注物理单位；该临时比例只用于可选轮速里程计，
    # 不参与导航定位或控制指令换算，需通过差速真车实测标定。
    feedback_wheel_speed_mps_per_speed_unit: 0.000436332313
    max_linear_velocity: 0.20
    max_angular_velocity: 0.80
