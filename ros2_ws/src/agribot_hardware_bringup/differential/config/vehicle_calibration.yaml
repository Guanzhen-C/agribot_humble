schema_version: 1
vehicle_type: differential
calibration_complete: false
base_link_reference: tracked_contact_patch_center

# Physical body extents measured from base_link on 2026-08-26. Safety margins
# remain explicit and are added only when building the navigation footprint.
geometry:
  body_front_m: 0.60
  body_rear_m: 0.60
  body_left_m: 0.38
  body_right_m: 0.38
  safety_front_m: 0.10
  safety_rear_m: 0.10
  safety_left_m: 0.15
  safety_right_m: 0.15
  # Geometric track-center spacing. Replace the control value only if the
  # in-place-turn test identifies a different effective skid-steer width.
  track_width_m: 0.60

drivetrain:
  invert_left_motor: false
  invert_right_motor: false
  # These empirical scales avoid assuming a motor-RPM/reduction-ratio model.
  command_full_scale_wheel_speed_mps: 0.80
  feedback_wheel_speed_mps_per_speed_unit: 0.000436332313

motion:
  reverse_enabled: true
  commissioning_linear_velocity_mps: 0.20
  commissioning_reverse_velocity_mps: 0.15
  commissioning_angular_velocity_radps: 0.80

required_measurements:
  - motor_direction_signs
  - command_percent_to_wheel_speed_scale
  - feedback_speed_unit_to_wheel_speed_scale_for_optional_wheel_odometry
  - maximum_linear_and_angular_velocity
  - effective_track_width_from_turn_test
  - lidar_imu_rotation_refinement
  - lidar_camera_extrinsics_validation
