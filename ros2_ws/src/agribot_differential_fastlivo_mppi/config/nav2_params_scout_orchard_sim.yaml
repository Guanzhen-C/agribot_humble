controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /fastlivo_rtk/odometry
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Four seconds of prediction covers 1.6 m at the simulation speed cap.
      time_steps: 40
      model_dt: 0.1
      batch_size: 1200
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.40
      vx_min: -0.25
      vy_max: 0.0
      wz_max: 1.00
      ax_max: 0.80
      ax_min: -0.80
      ay_min: 0.0
      ay_max: 0.0
      az_max: 1.50
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      reset_period: 1.0
      prune_distance: 3.0
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.15
      inversion_yaw_tolerance: 0.30
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: mppi::DefaultOptimalTrajectoryValidator
        collision_lookahead_time: 2.0
        consider_footprint: true
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 8
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      # Scout collision envelope plus approximately 9 cm fore/aft clearance.
      footprint: "[[0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35]]"
      footprint_padding: 0.03
      plugins: [static_layer, stvl_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 4.0
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /lidar/points
          marking: true
          clearing: false
          obstacle_range: 10.0
          min_obstacle_height: 0.15
          max_obstacle_height: 1.80
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clear:
          data_type: PointCloud2
          topic: /lidar/points
          marking: false
          clearing: true
          min_z: 0.30
          max_z: 10.0
          vertical_fov_angle: 0.523599
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.283185
          decay_acceleration: 5.0
          model_type: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      footprint: "[[0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35]]"
      footprint_padding: 0.03
      plugins: [static_layer, stvl_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /lidar/points
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: 0.15
          max_obstacle_height: 1.80
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clear:
          data_type: PointCloud2
          topic: /lidar/points
          marking: false
          clearing: true
          min_z: 0.30
          max_z: 8.0
          vertical_fov_angle: 0.523599
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.283185
          decay_acceleration: 5.0
          model_type: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: ""
      tolerance: 0.20
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      reverse_penalty: 1.8
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      smooth_path: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    stop_on_failure: false

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
