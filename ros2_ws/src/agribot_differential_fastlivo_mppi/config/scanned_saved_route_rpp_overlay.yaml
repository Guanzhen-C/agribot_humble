# Alternate existing controller for a fixed dense route in the scanned scene.
# Collision checking stays enabled; this does not change any hardware profile.
FollowPath:
  plugin: agribot_vehicle_description::PositionOnlyRegulatedPurePursuitController
  desired_linear_vel: 0.5
  lookahead_dist: 0.6
  min_lookahead_dist: 0.35
  max_lookahead_dist: 0.8
  lookahead_time: 1.2
  use_velocity_scaled_lookahead_dist: true
  min_approach_linear_velocity: 0.08
  use_collision_detection: true
  max_allowed_time_to_collision_up_to_carrot: 1.0
  use_regulated_linear_velocity_scaling: true
  use_cost_regulated_linear_velocity_scaling: false
  regulated_linear_scaling_min_radius: 0.8
  regulated_linear_scaling_min_speed: 0.1
  use_rotate_to_heading: true
  rotate_to_heading_angular_vel: 0.5
  rotate_to_heading_min_angle: 0.55
  max_angular_accel: 0.8
  transform_tolerance: 0.8
  allow_reversing: false
