lslidar_lio_sam_adapter:
  ros__parameters:
    input_topic: /lidar/points
    output_topic: /lio_sam/points
    output_frame: lidar_link
    # Legacy bag compatibility: recordings made before 2026-08-22 contain
    # 0..scan_duration point times while the cloud stamp marks the sweep end.
    # Live/future scan-start clouds do not need this adapter normalization.
    input_stamp_is_scan_end: true
    maximum_scan_duration: 0.20
    maximum_ring: 15

    # Exclude a person following behind the vehicle before LIO-SAM consumes
    # the scan. Bounds are expressed in rear-axle-centered base_link.
    rear_exclusion_enabled: true
    rear_exclusion_min_x: -4.0
    rear_exclusion_max_x: -0.1275
    rear_exclusion_half_width: 0.60

    # Remove both vehicle-mounted RTK antennas before scan matching and PCD
    # accumulation. Boxes are expressed in rear-axle-centered base_link.
    antenna_exclusion_enabled: true
    left_antenna_center_xyz: [0.1425, 0.2952585, 0.78476]
    right_antenna_center_xyz: [0.1425, -0.2952585, 0.78476]
    # Remove both antennas and their 0.5 m vertical supports.
    antenna_exclusion_half_extent_xyz: [0.08, 0.08, 0.60]
    base_to_lidar_xyz: [0.48, 0.0, 0.233]
    base_to_lidar_rpy: [-0.007648487, -0.001835661, 0.000007020]
