rtk_odometry_adapter:
  ros__parameters:
    fix_topic: /rtk/fix
    quality_topic: /rtk/fix_quality
    heading_topic: /rtk/heading_with_covariance
    heading_solution_topic: /rtk/heading_solution
    position_output_topic: /comparison/robot_localization/rtk_odom
    antenna_output_topic: /comparison/robot_localization/rtk_antenna
    heading_output_topic: /comparison/robot_localization/rtk_heading
    reference_topic: /comparison/robot_localization/rtk_reference
    status_topic: /comparison/robot_localization/rtk_status
    enu_frame: enu
    antenna_frame: rtk_master_antenna
    lidar_frame: base_link
    # 左主天线测量点到后轴中心base_link原点的FLU向量。
    antenna_to_lidar_flu_m: [-0.1425, -0.2952585, -0.28476]
    maximum_lever_heading_age_sec: 1.5
    required_fix_quality: 4
    fixed_heading_solutions: [L1_INT, NARROW_INT]
    float_heading_solutions: [L1_FLOAT, NARROW_FLOAT]
    fixed_heading_std_floor_deg: 1.0
    float_heading_std_floor_deg: 5.0
    heading_solution_timeout_sec: 1.5
    default_horizontal_std_m: 0.03
    default_vertical_std_m: 0.06
    auto_reference_from_first_fix: true
    reference_latitude_deg: 0.0
    reference_longitude_deg: 0.0
    reference_altitude_m: 0.0
